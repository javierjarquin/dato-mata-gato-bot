[project]
name = "dato-mata-gato-bot"
version = "0.1.0"
description = "Puente Telegram <-> Claude Code para el pipeline de Dato Mata Gato (tts-kokoro + illustrated-narrator)."
requires-python = ">=3.10"
dependencies = [
    # [job-queue] NO es opcional acá: sin ese extra app.job_queue es None y
    # la publicación diaria automática nunca se dispara, sin error visible.
    "python-telegram-bot[job-queue]>=21.0",
    # zoneinfo en Windows no trae la base de zonas horarias: sin tzdata,
    # ZoneInfo("America/Mexico_City") revienta al arrancar el bot.
    "tzdata>=2024.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "playwright>=1.40",
    # Páginas de PDF (recomendaciones de la CNDH, sentencias) como evidencia.
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dato-mata-gato-bot = "dato_mata_gato_bot.bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
