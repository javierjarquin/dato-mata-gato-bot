[project]
name = "dato-mata-gato-bot"
version = "0.1.0"
description = "Puente Telegram <-> Claude Code para el pipeline de Dato Mata Gato (tts-kokoro + illustrated-narrator)."
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dato-mata-gato-bot = "dato_mata_gato_bot.bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
